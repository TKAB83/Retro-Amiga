name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Release APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true

      - name: Generate temporary signing keystore
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/signing/release.jks" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias mykey \
            -storepass android -keypass android \
            -dname "CN=RetroAmiga, OU=Dev, O=Home, L=City, S=State, C=PL"

      - name: Build release APK
        working-directory: app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: mykey
          ANDROID_KEY_PASSWORD: android
          ORG_GRADLE_PROJECT_androidAbiFilters: arm64-v8a
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2"
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: retro-amiga-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 5
